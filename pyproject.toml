[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-agent"
version = "0.1.0"
description = "Business Metrics Anomaly Agent"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "statsmodels",
    "pydantic",
    "pyyaml",
    "groq",
    "python-dotenv",
    "jinja2",
    "pytest",
    "ruff",
    "mypy",
    "streamlit",
]

[project.scripts]
anomaly-agent = "anomaly_agent.cli:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
